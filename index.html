<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>导航页面</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #f5f5f5;
            font-size: 14px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .nav-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }
        .nav-item {
            display: block;
            padding: 15px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .nav-item:hover {
            background-color: #45a049;
        }
        .info {
            margin-top: 30px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #2196F3;
        }
        .info h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 16px;
        }
        .info p {
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>导航页面</h1>
        <div class="nav-container">
            <a href="trading-record.html" class="nav-item">交易记录</a>
        </div>
        <div class="info">
            <h2>关于本系统</h2>
            <p>本系统提供交易记录管理功能，您可以通过上方导航进入交易记录页面，查看和管理您的交易记录。</p>
            <p>系统特点：</p>
            <ul>
                <li>添加、编辑、删除交易记录</li>
                <li>实时获取股票最新价格</li>
                <li>计算交易收益和浮盈</li>
                <li>数据保存到本地存储</li>
            </ul>
        </div>
    </div>
    <script>
        new Vue({
            el: '#app',
            data: {
                // 可以添加其他导航项或数据
            }
        });
    </script>
</body>
</html>
